<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="30%" cy="25%" r="90%">
      <stop offset="0%" stop-color="#3B2470" />
      <stop offset="55%" stop-color="#1B1140" />
      <stop offset="100%" stop-color="#0A0920" />
    </radialGradient>
    <radialGradient id="planet" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFD8A8" />
      <stop offset="35%" stop-color="#FB923C" />
      <stop offset="75%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#9A3412" />
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#A5F3FC" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)" />

  <g fill="#FFFFFF">
    <circle cx="96" cy="120" r="3" opacity="0.9" />
    <circle cx="150" cy="380" r="2.5" opacity="0.7" />
    <circle cx="430" cy="150" r="2.5" opacity="0.8" />
    <circle cx="410" cy="360" r="2" opacity="0.6" />
  </g>

  <g transform="translate(256,256) scale(0.72) translate(-256,-262)">
    <ellipse cx="256" cy="270" rx="192" ry="58" fill="none" stroke="url(#ring)" stroke-width="10"
      transform="rotate(-18 256 270)" filter="url(#glow)" opacity="0.55" />
    <circle cx="256" cy="262" r="118" fill="url(#planet)" />
    <circle cx="256" cy="262" r="118" fill="none" stroke="#FED7AA" stroke-width="1.5" opacity="0.3" />
    <ellipse cx="256" cy="270" rx="192" ry="58" fill="none" stroke="url(#ring)" stroke-width="7"
      transform="rotate(-18 256 270)" filter="url(#glow)"
      stroke-dasharray="330 270" stroke-dashoffset="-150" />
  </g>
</svg>
